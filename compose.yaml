services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - task-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  task-data:
